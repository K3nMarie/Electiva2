name: Alerta DevOps ITLA

on:
  push:
    branches:
      - main

jobs:
  hola-mundo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar Hola Mundo
        run: node holaMundo.js

      - name: Enviar notificación a ntfy
        run: |
          curl \
            -H "Title: Hola Mundo - Kendy Marie Rodriguez Inoa | 2025-1121" \
            -H "Priority: default" \
            -d "GitHub Actions ITLA." \
            https://ntfy.sh/devops-itla
